# Build AutoLogin for Minecraft 1.21.11. The 26.x line lives on main and gets
# a version matrix; this legacy branch targets one release only.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "microsoft"

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: autologin-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
