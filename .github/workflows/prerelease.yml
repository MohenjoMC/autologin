# One dispatch, one pre-release: every supported Minecraft version from both
# branches, built on Blacksmith runners and attached to a single GitHub release.
#
# Run it from the Actions tab (or `gh workflow run prerelease -f tag=v1.0.0-test.2`).
# Re-running with the same tag replaces the previous pre-release, so test builds
# stay a single link instead of a pile of them.
name: prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (created at the dispatched commit if missing)"
        required: true
        default: "v1.0.0-test.1"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true

permissions:
  contents: write

# Two dispatches for the same tag must not race over the release: the second would
# delete the first one's tag while the first is still uploading.
concurrency:
  group: prerelease-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: "main"
            mc: "26.1"
            api: "0.155.3+26.1.2"
            cloth: "26.1.154"
            modmenu: "18.0.2"
            mc_dep: "~26.1"
          - ref: "main"
            mc: "26.1.1"
            api: "0.155.3+26.1.2"
            cloth: "26.1.154"
            modmenu: "18.0.2"
            mc_dep: "~26.1"
          - ref: "main"
            mc: "26.1.2"
            api: "0.155.3+26.1.2"
            cloth: "26.1.154"
            modmenu: "18.0.2"
            mc_dep: "~26.1"
          - ref: "main"
            mc: "26.2"
            api: "0.161.0+26.2"
            cloth: "26.2.155"
            modmenu: "20.0.3"
            mc_dep: "~26.2"
          - ref: "main"
            mc: "26.3"
            api: "0.165.0+26.3"
            cloth: "26.3.159"
            modmenu: "21.0.0"
            mc_dep: "~26.3"
          - ref: "1.21.11"
            mc: "1.21.11"
            api: "0.141.6+1.21.11"
            cloth: "21.11.160"
            modmenu: "17.0.0"
            mc_dep: "~1.21.11"
    steps:
      - name: Checkout ${{ matrix.ref }}
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"

      - name: Build for Minecraft ${{ matrix.mc }}
        run: |
          chmod +x ./gradlew
          ./gradlew build gametestClasses --stacktrace \
            -Pminecraft_version="${{ matrix.mc }}" \
            -Pfabric_api_version="${{ matrix.api }}" \
            -Pcloth_config_version="${{ matrix.cloth }}" \
            -Pmodmenu_version="${{ matrix.modmenu }}" \
            -Pminecraft_dependency="${{ matrix.mc_dep }}"

      - name: Upload Minecraft ${{ matrix.mc }} jar
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.mc }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect the jars
        uses: actions/download-artifact@v5
        with:
          path: jars
          merge-multiple: true

      - name: Show what ships
        run: ls -l jars

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          MARK_PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: |
          set -euo pipefail

          # Only ever replace a previous pre-release: a real release with this tag
          # is somebody else's and must not be deleted by a test build.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease 2>/dev/null | grep -q true; then
            echo "Replacing the existing pre-release $TAG"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          fi

          cat > notes.md <<'EOF'
          Test build of **AutoLogin** - a password manager for Minecraft servers that ask you to log in.

          ## What to test

          | Jar | Minecraft | Notes |
          |---|---|---|
          | `autologin-*-26.3.jar` | 26.3 | newest line |
          | `autologin-*-26.2.jar` | 26.2 | |
          | `autologin-*-26.1*.jar` | 26.1, 26.1.1, 26.1.2 | chat picker uses the 26.1 chat-HUD path |
          | `autologin-*-1.21.11.jar` | 1.21.11 | legacy line |

          Requires **Fabric API** and **Cloth Config**. Mod Menu is optional but nice.

          1. Join a server that uses an auth plugin (AuthMe, nLogin, LibreLogin, LoginSecurity...).
          2. The prompt should appear as clickable options:
             `[1] main  [+] add login  [x] later`.
             Nothing is sent until you click.
          3. Click an option: the password goes out as `/login <password>` and the chat shows
             `AutoLogin: sent main to ...`. It must **not** appear in the chat input box
             (press `T` and `Up` - nothing should come back).
          4. Click `[+] add login` and save one; it should survive a restart and be offered next time.
          5. Watch for the "that password did not work" line when the server rejects it.
          6. Try `F9`, `/autologin`, `/autologin list`, `/autologin config`, and the Cloth settings screen.
          7. Report the version, the plugin (if known), and what the server printed.

          ## Known limits

          - 26.1.x and 26.2 are compile-checked; only 26.3 and 1.21.11 were run through the client gametest.
          - Prompts are recognised by text patterns. If yours is missed, add a regex under
            **Custom rules** and say which server printed it so it can ship as a default.
          - Saved logins are encrypted to the machine they were saved on. Copying the config folder to
            another PC will report the vault as unreadable (it will not overwrite it) instead of decrypting.
          EOF

          gh release create "$TAG" jars/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AutoLogin $TAG - test build" \
            --notes-file notes.md \
            $MARK_PRERELEASE
